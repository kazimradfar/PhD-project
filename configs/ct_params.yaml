# PyRadiomics settings for the low-dose CT of the PSMA PET/CT
# Low-dose CT is noisy; CT radiomics here is exploratory (bone vs. soft-tissue lesions).

imageType:
  Original: {}
  LoG:
    sigma: [1.0, 2.0, 3.0]
  Wavelet: {}

featureClass:
  shape:
  firstorder:
  glcm:
  glrlm:
  glszm:
  gldm:
  ngtdm:

setting:
  binWidth: 25                    # HU
  resampledPixelSpacing: [1.0, 1.0, 1.0]
  interpolator: sitkBSpline
  padDistance: 10
  # Keep -1000..3000 HU (removes air/metal artefact voxels at the mask edge)
  resegmentRange: [-1000, 3000]
  resegmentMode: absolute
  label: 1
  minimumROIDimensions: 3
  minimumROISize: 27
  normalize: false
  correctMask: true
  geometryTolerance: 0.001
  additionalInfo: true
